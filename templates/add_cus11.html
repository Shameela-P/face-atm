<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATM Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#f4f6f9;}
.topmenu{
background:#7a0c0c;
color:#fff;
padding:12px 25px;
}
.sidebar{
height:100vh;
background:#5c0909;
padding:20px;
}
.sidebar a{
background:#7a0c0c;
color:#fff;
padding:12px;
border-radius:8px;
text-decoration:none;
display:block;
margin-bottom:10px;
}
.sidebar a:hover{background:#ffc107;color:#000;}
.card-stat{border-left:6px solid #0d6efd;}
.card-alert{border-left:6px solid #dc3545;}
</style>
</head>
<body>
<!-- TOP MENU -->
<div class="topmenu d-flex justify-content-between align-items-center">
<h5 class="mb-0"><i class="fa-solid fa-gauge"></i> ATM Admin Dashboard</h5>
<button class="btn btn-warning btn-sm"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
</div>

<div class="container-fluid">
<div class="row">
<!-- SIDEBAR -->
<div class="col-md-2 sidebar">
<a href="/admin"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
<!--<a href="#"><i class="fa-solid fa-face-smile"></i> Face Records</a>
<a href="#"><i class="fa-solid fa-video"></i> Live Camera</a>
<a href="#"><i class="fa-solid fa-triangle-exclamation"></i> Fraud Alerts</a>
<a href="#"><i class="fa-solid fa-gear"></i> Settings</a>-->
</div>

<!-- CONTENT -->
<div class="col-md-10 p-4">
<div class="row">
<div class="col-md-4">
<div class="card card-stat p-3">
<h6>Total Registered Faces</h6>
<h3>1,245</h3>
</div>
</div>
<div class="col-md-4">
<div class="card card-stat p-3">
<h6>Verified Transactions</h6>
<h3>982</h3>
</div>
</div>
<div class="col-md-4">
<div class="card card-alert p-3">
<h6>Fraud Attempts</h6>
<h3 class="text-danger">12</h3>
</div>
</div>
</div>

<div class="card mt-4">
<div class="card-header bg-primary text-white">
<i class="fa-solid fa-camera"></i> Recent Face Detection Logs
</div>
<div class="card p-4 shadow-sm">
<h5 class="mb-3"><i class="fa-solid fa-user-plus"></i> Account Holder Registration</h5>
<div class="row">
<div class="col-md-6 mb-3">
<label>Account Holder Name</label>
<input type="text" class="form-control" placeholder="Enter full name">
</div>
<div class="col-md-6 mb-3">
<label>Account Number</label>
<input type="text" class="form-control" placeholder="ATM Account Number">
</div>
<div class="col-md-6 mb-3">
<label>Mobile Number</label>
<input type="text" class="form-control" placeholder="Registered mobile">
</div>
<div class="col-md-6 mb-3">
<label>ATM Branch</label>
<select class="form-select">
<option>Select Branch</option>
<option>Chennai</option>
<option>Bangalore</option>
<option>Hyderabad</option>
</select>
</div>
</div>
<button class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save & Proceed</button>
</div>
</div>
</div>
</div>
</div>


</body>
</html>
