<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATM Admin | Customer Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{background:#f4f6f9;}

.topmenu{
    background:#7a0c0c;
    color:#fff;
    padding:12px 25px;
}

.sidebar{
    height:100vh;
    background:#5c0909;
    padding:20px;
}

.sidebar a{
    background:#7a0c0c;
    color:#fff;
    padding:12px;
    border-radius:8px;
    text-decoration:none;
    display:block;
    margin-bottom:10px;
    font-weight:500;
}

.sidebar a:hover{
    background:#ffc107;
    color:#000;
}
</style>
</head>

<body>

<!-- TOP MENU -->
<div class="topmenu d-flex justify-content-between align-items-center">
    <h5 class="mb-0">
        <i class="fa-solid fa-gauge"></i> ATM Admin Dashboard
    </h5>
    <button class="btn btn-warning btn-sm" onClick="window.location.href='/logout'">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
</div>

<div class="container-fluid">
<div class="row">

    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar">
        <a href="/admin">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="col-md-10 p-4">

        <!-- PAGE HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">
                <i class="fa-solid fa-users"></i> Customer 
            </h4>

         
        </div>

        <!-- CUSTOMER TABLE CARD -->
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="fa-solid fa-clock-rotate-left"></i> Transaction History
            </div>

            <div class="table-responsive">
			{% if st=="1" %}
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Transaction</th>
                            <th>Account No.</th>
                            <th>Amount</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody>
						{% for rs in data %}
                        <tr>
                            <td>{{loop.index}}</td>
                            <td>{{rs[1]}}</td>
                            <td>{{rs[2]}}</td>
                            <td>{{rs[3]}}</td>
                            <td>{{rs[4]}}</td>
                        </tr>
					{% endfor %}
                        
                    </tbody>
                </table>
				{% endif %}
				<p align="center"><a href="/view_full?vid={{vid}}">Back</a></p>
				
				{% if st=="" %}
				<div class="bg-danger">No Information Found!</div>
				{% endif %}
            </div>

        </div>

    </div>
</div>
</div>

</body>
</html>
