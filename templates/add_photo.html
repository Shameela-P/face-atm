<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATM Admin | Customer Details</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#f4f6f9;}
.topmenu{
    background:#7a0c0c;
    color:#fff;
    padding:12px 25px;
}
.sidebar{
    height:100vh;
    background:#5c0909;
    padding:20px;
}
.sidebar a{
    background:#7a0c0c;
    color:#fff;
    padding:12px;
    border-radius:8px;
    text-decoration:none;
    display:block;
    margin-bottom:10px;
    font-weight:500;
}
.sidebar a:hover{
    background:#ffc107;
    color:#000;
}
.camera-box{
    width: 360px;
    height: 360px;
    border: 3px solid #e0e0e0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}
.camera-view{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}
.card p{
    margin-bottom: 8px;
}
</style>
<script language="javascript">
function validate()
{
	if(document.form1.name.value=="")
	{
	alert("Enter the Name");
	document.form1.name.focus();
	return false;
	}
	if(document.form1.mobile.value=="")
	{
	alert("Enter the Mobile No.");
	document.form1.mobile.focus();
	return false;
	}
	if(isNaN(document.form1.mobile.value))
	{
	alert("Invalid Mobile No.");
	document.form1.mobile.select();
	return false;
	}
	if(document.form1.mobile.value.length!=10)
	{
	alert("Mobile No. must be 10 digits!");
	document.form1.mobile.select();
	return false;
	}
	if(document.form1.email.value=="")
	{
	alert("Enter the Email");
	document.form1.email.focus();
	return false;
	}
	if (/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/.test(document.form1.email.value))  
	{
	}
	else
	{
	alert("Invalid E-mail!");
	document.form1.email.select();
	return false;
	}
	if(document.form1.address.value=="")
	{
	alert("Enter the Address");
	document.form1.address.focus();
	return false;
	}
	if(document.form1.aadhar.value=="")
	{
	alert("Enter the Aadhar No.");
	document.form1.aadhar.focus();
	return false;
	}
return true;
}
</script>
</head>
<body>
<!-- TOP MENU -->
<div class="topmenu d-flex justify-content-between align-items-center">
    <h5 class="mb-0">
        <i class="fa-solid fa-gauge"></i> ATM Admin Dashboard
    </h5>
    <button class="btn btn-warning btn-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
    </button>
</div>
<div class="container-fluid">
<div class="row">
    <!-- SIDEBAR -->
    <div class="col-md-2 sidebar">
        <a href="/admin">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
    </div>
    <!-- MAIN CONTENT -->
    <div class="col-md-10 p-4">
        <!-- PAGE HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">
                <i class="fa-solid fa-camera"></i> Add Face Template
            </h4>
        </div>
        <!-- CUSTOMER TABLE CARD -->
        <div class="card shadow-sm p-3">
    <!-- Instruction -->
    <p class="text-center fw-semibold text-secondary mb-2">
        Capture multiple face templates by turning your head:
        <span class="text-primary">Left</span>,
        <span class="text-primary">Right</span>,
        <span class="text-primary">Up</span>,
        <span class="text-primary">Down</span>
    </p>
    <!-- Camera Frame -->
    <div class="camera-box mx-auto mb-3">
        <img src="{{ url_for('video_feed2') }}" class="camera-view">
    </div>
    <!-- Hidden Auto Submit Form -->
    <form id="form1" method="post" action="/add_photo?act=1&vid={{ vid }}">
        <input type="hidden" name="vid" value="{{ vid }}">
    </form>
    <!-- Countdown Message -->
    <p class="text-center text-muted small mb-0">
        Capturing automatically please keep your face within the frame
    </p>
</div>
<script>
    // Auto-submit after 20 seconds
    setTimeout(function () {
        document.getElementById("form1").submit();
    }, 20000);
</script>
    </div>
</div>
</div>
</body>
</html>
